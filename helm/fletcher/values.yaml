# Default values for fletcher.
replicaCount: 1

image:
  repository: ghcr.io/23skdu/longbow-fletcher
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Fletcher Server Specific Configuration
server:
  # Model to load (bert-tiny, nomic-embed-text, all-MiniLM-L6-v2, roberta-base, xlm-roberta-base, bge-m3, e5-mistral-7b-instruct)
  model: "bert-tiny"
  # Precision: fp32 or fp16
  precision: "fp32"
  # Optional: Forward embeddings to Longbow server address
  forwardTo: ""
  # Enable GPU usage flag (-gpu)
  useGPU: false
  # Transport format: fp32 or fp16
  transportFmt: "fp32"
  # Maximum VRAM usage for admission control
  maxVRAM: "4GB"
  # Maximum concurrent sequences
  maxConcurrent: 16384
  # Target dataset name when forwarding
  dataset: "fletcher_dataset"
  # Flight Server Configuration
  flightEnabled: false
  flightPort: 9090
  # API Key for authentication (optional)
  apiKey: ""
  # API key required by Fletcher HTTP server (optional)
  serverAPIKey: ""
  # Tenant for Longbow authentication (optional)
  tenant: ""
  # TLS/mTLS settings for Flight server
  tls:
    enabled: false
    certFile: ""
    keyFile: ""
    caFile: ""
  # Vocab file path
  vocabPath: "vocab.txt"
  # Weights file path
  weightsPath: "bert_tiny.bin"

# Monitoring Configuration
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    # Namespace for the ServiceMonitor (defaults to release namespace if empty)
    namespace: ""
    # Additional labels for the ServiceMonitor (e.g., release: prometheus)
    labels: {}
    interval: 15s
    scrapeTimeout: 10s

nodeSelector: {}

tolerations: []

affinity: {}
