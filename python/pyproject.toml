[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fletcher"
version = "0.1.0"
description = "Python SDK for Fletcher embedding server"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.21",
    "black>=26.10.1",
    "mypy>=1.0",
]
